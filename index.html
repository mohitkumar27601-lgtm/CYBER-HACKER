<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b09">
<title>CYBER HACKER</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{color-scheme:dark;--bg:#080b09;--pn:#101612;--g:#39ff6a;--b:#3aa0ff;--r:#ff4d5e;--t:#c9f5d4;--m:#6b8a74}
html,body{height:100%;margin:0;background:var(--bg);color:var(--t);font:15px/1.4 ui-monospace,Menlo,Consolas,monospace;overscroll-behavior:none}
body{padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,rgba(255,255,255,.018) 0 1px,transparent 1px 3px)}
#app{max-width:480px;margin:auto;height:100%;display:flex;flex-direction:column;padding:12px;overflow-y:auto}
.logo{font-size:38px;font-weight:900;text-align:center;letter-spacing:3px;color:var(--g);text-shadow:0 0 14px var(--g);margin:5vh 0 4px}
.logo span{color:var(--b);text-shadow:0 0 14px var(--b);display:block}
.sub{text-align:center;color:var(--m);min-height:20px;margin-bottom:14px}
.btn{display:block;width:100%;padding:13px;margin:6px 0;background:var(--pn);color:var(--g);border:1px solid var(--g);border-radius:8px;font:inherit;font-weight:700;letter-spacing:1px;text-align:center}
.btn:active{background:var(--g);color:#000}
.btn.sm{width:auto;display:inline-block;padding:8px 12px;margin:3px}
.btn[disabled]{opacity:.4}
.card{background:var(--pn);border:1px solid #1e2c22;border-radius:10px;padding:12px;margin:7px 0}
.top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.top h2{flex:1;margin:0;font-size:16px;color:var(--g)}
.tm{color:var(--b);font-weight:700}.tm.lo{color:var(--r)}
.bar{height:8px;background:#1a241d;border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--g),var(--b))}
.in{width:100%;padding:12px;background:#000;border:1px solid var(--b);border-radius:8px;color:var(--g);font:inherit;margin:6px 0}
.term{background:#000;border:1px solid var(--g);border-radius:8px;padding:8px;height:38vh;overflow-y:auto;white-space:pre-wrap;word-break:break-word;font-size:13px;color:var(--g)}
.tin{display:flex;gap:6px;align-items:center}
.grid{display:grid;gap:3px;width:min(100%,330px);margin:8px auto}
.cell{aspect-ratio:1;background:#0d1410;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:14px}
.cell.w{background:#24362a}.cell.x{background:#4a1018}.cell.e{background:#0a3a5a}
.cell.p{background:var(--g);box-shadow:0 0 10px var(--g);color:#000}
.dpad{display:grid;grid-template-columns:repeat(3,68px);gap:4px;justify-content:center}
.dpad .btn{margin:0;padding:12px 0}
.slot{display:flex;justify-content:space-between;gap:8px;padding:10px;margin:5px 0;border:1px dashed var(--b);border-radius:8px;min-height:44px;font-size:13px}
.slot span{color:var(--m);text-align:right}
.pool{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{touch-action:none;user-select:none;padding:9px 11px;border:1px solid var(--b);border-radius:18px;background:#0c1a26;color:var(--t);font-size:13px}
.chip.sel{border-color:var(--g);box-shadow:0 0 8px var(--g)}
.ghost{position:fixed;transform:translate(-50%,-50%);pointer-events:none;z-index:99;opacity:.9}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.86);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px}
.ov .card{width:100%;max-width:400px}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);background:#000;border:1px solid var(--g);color:var(--g);padding:10px 14px;border-radius:8px;z-index:70;text-align:center}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lock{opacity:.45}
.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.st{color:#ffd54a;letter-spacing:2px}
#rain{position:fixed;inset:0;width:100%;height:100%;z-index:0;opacity:.28}
#app{position:relative;z-index:1}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:49;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.8))}
.logo{font-size:40px;letter-spacing:5px;animation:gl 5s infinite}
@keyframes gl{0%,90%,100%{transform:none}92%{transform:translate(-3px,1px);text-shadow:3px 0 var(--r),-3px 0 var(--b)}95%{transform:translate(3px,-1px);text-shadow:-3px 0 var(--r),3px 0 var(--b)}}
@keyframes bl{50%{opacity:.25}}
.btn{border-radius:3px;background:linear-gradient(90deg,color-mix(in srgb,var(--g) 14%,#050805),#050805 70%);box-shadow:inset 0 0 12px rgba(0,0,0,.7),0 0 8px color-mix(in srgb,var(--g) 25%,transparent);text-shadow:0 0 6px var(--g);text-transform:uppercase;font-size:14px}
.btn:active{box-shadow:0 0 18px var(--g);text-shadow:none}
.mb{display:flex;align-items:center;text-align:left}
.mb::before{content:"["attr(data-n)"]";color:var(--b);margin-right:12px;font-size:12px;text-shadow:none}
.mb::after{content:"▸";margin-left:auto}
.card{background:linear-gradient(180deg,rgba(16,26,19,.92),rgba(7,12,9,.92));border:1px solid color-mix(in srgb,var(--g) 25%,#000);border-left:3px solid var(--g);border-radius:3px;box-shadow:0 0 12px rgba(0,0,0,.6)}
.hud{display:flex;justify-content:space-between;font-size:11px;color:var(--m);border-bottom:1px solid color-mix(in srgb,var(--g) 30%,#000);padding:4px 2px;letter-spacing:1px}
.hud span:first-child{color:var(--g);animation:bl 1.4s infinite}
.top{padding-bottom:8px;border-bottom:1px solid color-mix(in srgb,var(--g) 30%,#000)}
.top h2{text-transform:uppercase;letter-spacing:1px;text-shadow:0 0 8px var(--g)}
.tm{font-size:15px;text-shadow:0 0 8px var(--b)}
.term{background:rgba(0,0,0,.92);box-shadow:inset 0 0 16px color-mix(in srgb,var(--g) 30%,transparent),0 0 10px color-mix(in srgb,var(--g) 20%,transparent);text-shadow:0 0 5px var(--g);line-height:1.5}
.in{border-radius:3px}.in:focus{outline:0;box-shadow:0 0 12px var(--b)}
.chip,.slot{border-radius:3px}
.cell{border-radius:2px;border:1px solid #14221a}
.bar{border-radius:0;height:6px;box-shadow:0 0 6px color-mix(in srgb,var(--g) 40%,transparent)}
#tg::after{content:"█";animation:bl 1s infinite}
.ico{display:block;width:min(44vw,180px);aspect-ratio:1;margin:10px auto 0;border-radius:22%;box-shadow:0 0 26px color-mix(in srgb,var(--g) 55%,transparent)}
.logo{margin:2vh 0 4px;font-size:34px}
</style></head><body><canvas id="rain"></canvas><div id="app"></div>

function beep(f,d=.08,ty='square',v=.05){if(!S.sfx)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
const sfx={tap:()=>beep(440,.03),ok:()=>{beep(660);setTimeout(()=>beep(880),90)},bad:()=>beep(150,.25,'sawtooth'),win:()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.15),i*110))};
function music(){clearInterval(mt);mt=null;if(!S.mus)return;const n=[110,131,165,131,98,123,147,123];let i=0;mt=setInterval(()=>{if(!paused)beep(n[i++%8],.5,'sine',.035)},600)}
addEventListener('pointerdown',()=>{try{AC&&AC.resume()}catch(e){}if(!mt)music()},{once:true});

function typeTo(el,txt,done){clearInterval(tt);el.textContent='';let i=0;tt=setInterval(()=>{el.textContent=txt.slice(0,++i);if(i>=txt.length){clearInterval(tt);done&&done()}},16)}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2400)}
function modal(h){closeM();const d=document.createElement('div');d.className='ov';d.id='ov';d.innerHTML='<div class=card>'+h+'</div>';document.body.appendChild(d)}
function closeM(){const o=$('#ov');o&&o.remove()}
function stopT(){clearInterval(tick);clearInterval(tt);cur=null;paused=false}

const xpPct=()=>{const l=lvl(),a=LV[l][1],n=LV[l+1]?LV[l+1][1]:a;return n>a?(S.xp-a)/(n-a)*100:100};
function menu(){stopT();from='menu';const ok=S.lastDaily!==today();
show(`<div class=hud><span>● SURAKSHIT LINK</span><span>LEVEL ${lvl()+1}</span><span>${S.coins} 🪙</span></div><img src="${ICON}" alt="" class=ico><div class=logo>CYBER<span>HACKER</span></div><div class=sub id=tg></div>`+[['Game Shuru Karo','newGame()'],['Aage Badho','cont()'],['Kahani Mode','story()'],['Mission','missions()'],['Hacker Profile','profile()'],['Uplabdhiyan','achs()'],['Setting','settings()']].map((b,i)=>`<button class="btn mb" data-n="0${i+1}" onclick="sfx.tap();${b[1]}">${b[0]}</button>`).join('')+`<div class=row><button class="btn sm" onclick="daily()">🎁 Roz Ka Inaam${ok?' ●':''}</button><button class="btn sm" onclick="dailyCh()">⚡ Roz Ki Challenge${S.dc!==today()?' ●':''}</button></div><div class=sub style="margin-top:10px;font-size:12px">RANK // ${LV[lvl()][0].toUpperCase()}<div class=bar style="margin-top:5px"><i style="width:${xpPct()}%"></i></div></div>`);
typeTo($('#tg'),'> sab kuch nakli simulation // saare system virtual_')}
function newGame(){if(Object.keys(S.done).length||S.xp)modal(`<b>Naya game shuru karna hai?</b><p>Progress mit jayega. Setting aur unlock ki hui theme bani rahengi.</p><button class=btn onclick="closeM();begin()">HAAN, RESET KARO</button><button class=btn onclick="closeM()">NAHI</button>`);else begin()}
function begin(){S=Object.assign(def(),{sfx:S.sfx,mus:S.mus,theme:S.theme,themes:S.themes});save();from='menu';brief(0)}
function cont(){let i=M.findIndex((m,k)=>!S.done[k]);if(i<0){toast('Saare chapter poore ho gaye!');return missions()}from='menu';brief(i)}
function lst(kind){from=kind;const st=kind=='story';show(`<div class=top><button class="btn sm" onclick="menu()">‹</button><h2>${st?'KAHANI MODE':'MISSION'}</h2></div>`+(st?`<div class=card style="font-size:13px;color:var(--m)">PROLOGUE: Helios City ek virtual grid par chalta hai. NULLFOX naam ke ek bhoot ne kaalpanik Project Lantern archive chura liya hai. Tum Aegis Digital Bureau ke naye rookie ho. Chapter dar chapter nishaan ka peecha karo, Shuruaati se Cyber Legend tak.</div>`:'')+M.map((m,i)=>`<div class="card row ${un(i)?'':'lock'}" onclick="${un(i)?`from='${kind}';brief(${i})`:`toast('🔒 Pehle pichhla mission poora karo')`}"><div><b>${st?'CHAPTER '+(i+1)+' ':(i+1)+'. '}${m.n}</b><br><span style="font-size:12px;color:var(--m)">${TYN[m.ty]} · ${fmt(m.t)}</span></div><span class=st>${un(i)?stars(S.done[i]):'🔒'}</span></div>`).join(''))}

function profile(){const l=lvl(),a=LV[l][1],n=LV[l+1]?LV[l+1][1]:a,p=n>a?(S.xp-a)/(n-a)*100:100,s=S.stats;show(`<div class=top><button class="btn sm" onclick="menu()">‹</button><h2>HACKER PROFILE</h2></div><div class=card><div style="color:var(--g);font-size:20px;font-weight:700">${LV[l][0]}</div>Level ${l+1} · ${S.xp} XP${LV[l+1]?` / ${n}`:' (SABSE UPAR)'}<div class=bar style="margin-top:6px"><i style="width:${p}%"></i></div></div><div class=card>🪙 Coins: ${S.coins}<br>Poore kiye mission: ${Object.keys(S.done).length}/15<br>Koshishein: ${s.played} · Jeete: ${s.won} · Haare: ${s.lost}<br>Khelne ka time: ${fmt(s.time)}<br>Roz ki streak: ${S.streak} · Roz ki jeet: ${s.dcw}<br>Uplabdhiyan: ${Object.keys(S.ach).length}/${A.length}</div><div class=card><b>RANK LIST</b><br>`+LV.map((x,i)=>`<span style="color:${i<=l?'var(--g)':'var(--m)'}">${i<=l?'✔':'○'} ${x[0]} (${x[1]} XP)</span>`).join('<br>')+`</div>`)}
const A=[['first','Pehla Sampark','Koi bhi mission poora karo',()=>Object.keys(S.done).length>0],['five','Naya Shikari','5 mission poore karo',()=>Object.keys(S.done).length>=5],['ten','Case Band Karne Wala','10 mission poore karo',()=>Object.keys(S.done).length>=10],['all','Case Ustaad','Saare 15 mission poore karo',()=>Object.keys(S.done).length>=15],['star','Bejod','Ek mission mein 3 star kamao',()=>Object.values(S.done).some(v=>v>=3)],['rich','Coin Sangrahak','500 coins jama karo',()=>S.coins>=500],['streak','Niyamit Khiladi','3 din ki roz-inaam streak',()=>S.streak>=3],['det','Jasoos Rank','Cyber Jasoos tak pahuncho',()=>lvl()>=2],['leg','Cyber Legend','Cyber Legend tak pahuncho',()=>lvl()>=5],['dc','Roz Ka Hacker','Roz ki challenge jeeto',()=>S.stats.dcw>0],['sty','Stylist','Ek theme unlock karo',()=>S.themes.slice(1).some(x=>x)]];
function checkAch(){A.forEach(a=>{if(!S.ach[a[0]]&&a[3]()){S.ach[a[0]]=1;S.coins+=25;toast('🏆 '+a[1]+' +25🪙')}})}
function achs(){show(`<div class=top><button class="btn sm" onclick="menu()">‹</button><h2>UPLABDHIYAN</h2></div>`+A.map(a=>`<div class="card ${S.ach[a[0]]?'':'lock'}"><b>${S.ach[a[0]]?'🏆':'🔒'} ${a[1]}</b><br><span style="font-size:13px;color:var(--m)">${a[2]} · +25🪙</span></div>`).join(''))}
function settings(){show(`<div class=top><button class="btn sm" onclick="menu()">‹</button><h2>SETTING</h2></div><button class=btn onclick="S.sfx=!S.sfx;save();settings();sfx.tap()">Awaaz (Sound Effects): ${S.sfx?'CHALU':'BAND'}</button><button class=btn onclick="S.mus=!S.mus;save();music();settings()">Background Music: ${S.mus?'CHALU':'BAND'}</button><div class=card><b>THEME</b> (🪙 ${S.coins})</div>`+TH.map((t,i)=>`<button class=btn style="color:${t[1]};border-color:${t[1]}" onclick="theme(${i})">${t[0]} — ${S.theme==i?'CHALU':S.themes[i]?'Unlock Hai':t[3]+'🪙 mein unlock karo'}</button>`).join('')+`<button class=btn style="color:var(--r);border-color:var(--r)" onclick="modal('<b>SAARA data mita dein?</b><p>Progress, coins aur theme sab chale jayenge.</p><button class=btn onclick=&quot;wipe()&quot;>MITAO</button><button class=btn onclick=&quot;closeM()&quot;>NAHI</button>')">Saara data mitao</button><div class=sub style="font-size:12px">CYBER HACKER poori tarah kaalpanik hai. Har terminal, file aur network game ke andar hi nakli roop mein chalta hai. Bina internet ke chalta hai; data isi device par rehta hai.</div>`)}
function theme(i){if(S.themes[i]){S.theme=i}else if(S.coins>=TH[i][3]){S.coins-=TH[i][3];S.themes[i]=1;S.theme=i;checkAch();sfx.ok()}else{sfx.bad();return toast('Coins kaafi nahi hain')}applyTheme();save();settings()}
function wipe(){S=def();save();applyTheme();closeM();menu()}
function daily(){const t=today();if(S.lastDaily===t)return modal(`<b>Pehle hi le liya</b><p>Aur inaam ke liye kal wapas aao.</p><button class=btn onclick="closeM()">THEEK HAI</button>`);const y=new Date(Date.now()-864e5).toISOString().slice(0,10);S.streak=S.lastDaily===y?S.streak+1:1;S.lastDaily=t;const c=25+10*Math.min(S.streak-1,6);S.coins+=c;S.xp+=10;checkAch();save();sfx.win();modal(`<b>🎁 Roz Ka Inaam</b><p>+${c}🪙 aur +10 XP<br>Streak: ${S.streak} din</p><button class=btn onclick="closeM();menu()">LE LO</button>`)}
function dailyCh(){if(S.dc===today())return modal(`<b>Roz ki challenge poori</b><p>Nayi challenge kal aayegi.</p><button class=btn onclick="closeM()">THEEK HAI</button>`);const u=M.map((m,i)=>i).filter(un);let h=0;for(const c of today())h+=c.charCodeAt(0);from='menu';brief(u[h%u.length],true)}
/* ---- gameplay ---- */
function play(i,d){stopT();const m=M[i];cur={i,daily:d,left:m.t,mis:0,hint:0,done:0};show(`<div class=top><h2>${m.n}</h2><span id=tm class=tm></span><button class="btn sm" onclick="pause()">❚❚</button></div><div class=card style="font-size:13px">🎯 ${m.ob}</div><div id=hn></div><div id=box></div><div style="margin-top:auto;padding-top:8px"><button class="btn sm" id=hb onclick="hint()">💡 Ishara (−25% XP)</button></div>`);
({in:inp,quiz,sort,maze,match,term:trm})[m.ty](m,$('#box'));clock();
tick=setInterval(()=>{if(paused||!cur)return;cur.left--;S.stats.time++;clock();if(cur.left<=0)finish(false)},1000)}
function clock(){const e=$('#tm');if(e){e.textContent='⏱ '+fmt(Math.max(0,cur.left));e.className='tm'+(cur.left<15?' lo':'')}}
function hint(){if(!cur)return;cur.hint=1;$('#hn').innerHTML=`<div class=card style="color:var(--b)">💡 ${M[cur.i].h}</div>`;$('#hb').disabled=true}
function pause(){if(!cur||paused||cur.done)return;paused=true;modal(`<h3 style="margin:0 0 8px">❚❚ ROKA HUA HAI</h3><button class=btn onclick="resume()">▶ Dobara Chalu Karo</button><button class=btn onclick="closeM();menu()">⌂ Menu Par Wapas</button>`)}
function resume(){paused=false;closeM()}
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
const bad=(pen)=>{cur.mis++;sfx.bad();if(pen)cur.left=Math.max(1,cur.left-5)};
function inp(m,b){b.innerHTML=`<div class=card style="white-space:pre-wrap">${m.q}</div><input id=ai class=in placeholder="Jawab likho..." autocomplete=off autocapitalize=off spellcheck=false><button class=btn id=ab>JAMA KARO</button><div id=fb style="min-height:22px"></div>`;
const go=()=>{if(m.a.includes(norm($('#ai').value))){sfx.ok();finish(true)}else{bad();$('#fb').innerHTML='<span style="color:var(--r)">✖ ACCESS NAKAAM</span>';shk($('#ai'))}};$('#ab').onclick=go;$('#ai').onkeydown=e=>e.key=='Enter'&&go()}
function quiz(m,b){let k=0;const d=()=>{const [q,o]=m.qs[k];b.innerHTML=`<div class=bar><i style="width:${k/m.qs.length*100}%"></i></div><div class=card style="white-space:pre-wrap">${k+1}/${m.qs.length}\n\n${q}</div>`+o.map((x,i)=>`<button class=btn data-i=${i}>${x}</button>`).join('');
b.querySelectorAll('[data-i]').forEach(e=>e.onclick=()=>{if(+e.dataset.i===m.qs[k][2]){sfx.ok();if(++k>=m.qs.length)finish(true);else d()}else{bad(1);e.disabled=true;e.style.borderColor='var(--r)';e.style.color='var(--r)'}})};d()}
function sort(m,b){const R=shuffle(m.it);let got=[];const d=()=>{b.innerHTML=`<div class=card style="min-height:80px">${got.map((x,i)=>`${i+1}. ${x}`).join('<br>')||'<span style="color:var(--m)">Sahi kram mein steps par tap karo…</span>'}</div>`+R.filter(x=>!got.includes(x)).map(x=>`<button class=btn data-v="${x}">${x}</button>`).join('');
b.querySelectorAll('[data-v]').forEach(e=>e.onclick=()=>{const v=e.dataset.v;if(v===m.it[got.length]){sfx.tap();got.push(v);if(got.length==m.it.length){sfx.ok();finish(true)}else d()}else{bad(1);shk(e)}})};d()}
function maze(m,b){const G=m.g,N=G.length;let p=[0,0];
const d=()=>{b.innerHTML=`<div class=grid style="grid-template-columns:repeat(${N},1fr)">`+G.map((r,y)=>[...r].map((c,x)=>`<div class="cell ${p[0]==y&&p[1]==x?'p':c=='#'?'w':c=='x'?'x':c=='E'?'e':''}">${p[0]==y&&p[1]==x?'◆':c=='x'?'☠':c=='E'?'⌂':c=='S'?'S':''}</div>`).join('')).join('')+`</div><div class=dpad><i></i><button class=btn id=mu>▲</button><i></i><button class=btn id=ml>◀</button><i></i><button class=btn id=mr>▶</button><i></i><button class=btn id=md>▼</button><i></i></div>`;
const mv=(dy,dx)=>{const y=p[0]+dy,x=p[1]+dx;if(y<0||x<0||y>=N||x>=N||G[y][x]=='#')return sfx.tap();if(G[y][x]=='x'){bad();p=[0,0];toast('☠ Firewall se takraye! Dobara shuru');return d()}p=[y,x];if(G[y][x]=='E'){d();sfx.ok();return finish(true)}sfx.tap();d()};
$('#mu').onclick=()=>mv(-1,0);$('#md').onclick=()=>mv(1,0);$('#ml').onclick=()=>mv(0,-1);$('#mr').onclick=()=>mv(0,1)};d()}
function match(m,b){const L=m.p.map(p=>p[0]),R=shuffle(m.p.map(p=>p[1]));let pl={},sel=null;
const put=(s,i)=>{for(const k in pl)if(pl[k]===i)delete pl[k];pl[s]=i;sel=null;sfx.tap();d()};
function d(){const used=Object.values(pl);b.innerHTML=`<div class=card style="color:var(--m);font-size:13px">Har description ko uske code par drag karo (ya pehle ek par tap karo, phir slot par tap karo).</div>`+L.map((l,i)=>`<div class=slot data-s=${i}><b>${l}</b><span>${pl[i]!=null?R[pl[i]]:'— yahan chhodo —'}</span></div>`).join('')+`<div class=pool>`+R.map((r,i)=>used.includes(i)?'':`<div class="chip${sel===i?' sel':''}" data-c=${i}>${r}</div>`).join('')+`</div><button class=btn id=vf>JAANCH KARO</button>`;
b.querySelectorAll('.slot').forEach(s=>s.onclick=()=>{const k=+s.dataset.s;if(sel!=null)put(k,sel);else if(pl[k]!=null){delete pl[k];d()}});
b.querySelectorAll('.chip').forEach(c=>c.onpointerdown=e=>{const i=+c.dataset.c,g=c.cloneNode(true);g.className='chip ghost';document.body.appendChild(g);const sx=e.clientX,sy=e.clientY;let mvd=0;
const mm=ev=>{mvd=Math.max(mvd,Math.hypot(ev.clientX-sx,ev.clientY-sy));g.style.left=ev.clientX+'px';g.style.top=ev.clientY+'px'};mm(e);
const up=ev=>{removeEventListener('pointermove',mm);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);g.remove();if(mvd>10){const el=document.elementFromPoint(ev.clientX,ev.clientY),s=el&&el.closest('.slot');if(s)put(+s.dataset.s,i);else d()}else{sel=sel===i?null:i;sfx.tap();d()}};
addEventListener('pointermove',mm);addEventListener('pointerup',up);addEventListener('pointercancel',up)});
$('#vf').onclick=()=>{let ok=1;L.forEach((l,i)=>{if(R[pl[i]]!==m.p[i][1]){ok=0;delete pl[i]}});if(ok){sfx.ok();finish(true)}else{bad();d()}}}
d()}
function trm(m,b){let cwd=[];b.innerHTML=`<div class=term id=to></div><div class=tin><input id=ti class=in placeholder="command likho…" autocapitalize=off autocomplete=off spellcheck=false><button class="btn sm" id=tg2>⏎</button></div><div>${m.ch.map(c=>`<button class="btn sm" data-c="${c}">${c}</button>`).join('')}</div>`;
const T=$('#to'),pr=s=>{T.textContent+=s+'\n';T.scrollTop=T.scrollHeight},nd=p=>p.reduce((n,k)=>n&&typeof n=='object'?n[k]:undefined,m.fs);
pr('AEGIS-VM 1.0 [nakli simulation] — help likho');
const run=c=>{c=c.trim();if(!c)return;pr('$ '+c);const [a,...r]=c.split(/\s+/),x=r.filter(t=>t[0]!='-')[0],fl=r.includes('-a');sfx.tap();
if(a=='help')pr('ls [-a] · cd <folder|..> · cat <file> · pwd'+(m.acc?' · accuse <naam>':''));
else if(a=='pwd')pr('/'+cwd.join('/'));
else if(a=='ls'){const n=nd(cwd);pr(Object.keys(n).filter(k=>fl||k[0]!='.').map(k=>typeof n[k]=='object'?k+'/':k).join('  ')||'(khaali)')}
else if(a=='cd'){if(x=='..')cwd.pop();else if(x&&typeof nd([...cwd,x])=='object')cwd.push(x);else pr('cd: aisa folder nahi hai')}
else if(a=='cat'){const v=x&&nd([...cwd,x]);if(typeof v=='string'){pr(v);if(m.g==x){pr('>> TARGET FILE MIL GAYI');sfx.ok();setTimeout(()=>finish(true),800)}}else pr('cat: padh nahi sakte')}
else if(a=='accuse'&&m.acc){if(norm(x||'')==m.acc){pr('KESH DARJ: sabut pakka hua.');sfx.ok();setTimeout(()=>finish(true),800)}else{pr('Radd: sabut isko support nahi karta.');bad()}}
else pr(a+': command nahi mila')};
$('#tg2').onclick=()=>{const i=$('#ti');run(i.value);i.value=''};$('#ti').onkeydown=e=>{if(e.key=='Enter'){run(e.target.value);e.target.value=''}};
b.querySelectorAll('[data-c]').forEach(e=>e.onclick=()=>run(e.dataset.c))}
/* ---- results ---- */
function finish(w){if(!cur||cur.done)return;cur.done=1;clearInterval(tick);const i=cur.i,m=M[i],c0=cur;S.stats.played++;let h;
if(w){const st=c0.mis<=1&&!c0.hint?3:c0.mis<=3?2:1,l0=lvl(),first=!S.done[i];let x=Math.round(rx(i)*(.7+.1*st)*(c0.hint?.75:1)),c=rc(i)+st*3,note='';
if(!first)x=Math.round(x/2),c=Math.round(c/2),note='<br><span style="color:var(--m)">Dobara khelne par 50% inaam</span>';
if(c0.daily&&S.dc!==today()){x*=2;c*=2;S.dc=today();S.stats.dcw++;note+='<br>⚡ Roz ki challenge ka bonus ×2'}
S.done[i]=Math.max(S.done[i]||0,st);S.xp+=x;S.coins+=c;S.stats.won++;checkAch();save();sfx.win();
const lu=lvl()>l0?`<div class=card style="border-color:var(--g)">⬆ RANK BADHA: <b>${LV[lvl()][0]}</b></div>`:'',ep=i==14&&first?`<div class=card style="white-space:pre-wrap">MIRA: NULLFOX bepardah ho gaya aur Project Lantern surakshit hai.\nMIRA: Rookie… ab tum Cyber Legend ho.\n\n★ GAME KHATAM ★</div>`:'';
h=`<div class=logo style="font-size:28px;margin-top:3vh">MISSION<span>POORA HUA</span></div><div class=card style="text-align:center"><div class=st style="font-size:28px">${stars(st)}</div>+${x} XP · +${c}🪙${note}</div>${lu}${ep}${i<14?`<button class=btn onclick="from='story';brief(${i+1})">AGLA CHAPTER ▶</button>`:''}<button class=btn onclick="play(${i},false)">↻ Dobara Khelo</button>`}
else{S.stats.lost++;save();sfx.bad();h=`<div class=logo style="font-size:28px;color:var(--r);text-shadow:0 0 14px var(--r);margin-top:3vh">MISSION<span style="color:var(--r)">FAIL HUA</span></div><div class=card style="text-align:center">Time khatam. Trace kho gaya.</div><button class=btn onclick="play(${i},${!!c0.daily})">↻ Dobara Koshish Karo</button>`}
stopT();show(h+`<button class=btn onclick="menu()">⌂ Mukhya Menu</button>`)}
(function(){const c=$('#rain'),x=c.getContext('2d'),ch='01ABCDEF<>/{}$#';let W,H,dr;function rs(){W=c.width=innerWidth;H=c.height=innerHeight;dr=Array(Math.ceil(W/16)).fill(0).map(()=>Math.random()*H/16)}rs();addEventListener('resize',rs);
setInterval(()=>{if(cur||document.hidden)return;x.fillStyle='rgba(8,11,9,.12)';x.fillRect(0,0,W,H);x.fillStyle=getComputedStyle(root).getPropertyValue('--g');x.font='14px monospace';dr.forEach((y,i)=>{x.fillText(ch[Math.random()*ch.length|0],i*16,y*16);dr[i]=y*16>H&&Math.random()>.975?0:y+1})},90)})();
function boot(){show('<div class=term id=bt style="height:55vh;margin-top:8vh;border:0;background:transparent;box-shadow:none"></div>');const L=['> CYBER-OS v2.6 shuru ho raha hai...','> virtual kernel load ho raha hai ... OK','> nakli network jud raha hai ...... OK','> jaanch: SAARE SYSTEM NAKLI HAIN','> link ban gaya. swagat hai, operator.'];let i=0,on=1;const go=()=>{if(on){on=0;app.onclick=null;menu()}},T=$('#bt'),n=()=>{if(!on)return;if(i>=L.length)return setTimeout(go,350);T.textContent+=L[i++]+'\n';beep(900,.02);setTimeout(n,280)};app.onclick=go;n()}
load();applyTheme();boot();
